<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>ملف الإنجاز المهني</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+Arabic:wght@400;500;600&family=Readex+Pro:wght@500;700&display=swap" rel="stylesheet">
<style>
:root{--ink:#10332f;--teal:#0f4c47;--sand:#f6f0e4;--paper:#fffdf8;--brass:#b8862f;--line:#e4dccb;--mut:#6b7a77;--r:14px}
*{box-sizing:border-box;margin:0}
html{scroll-behavior:smooth}
body{font-family:'IBM Plex Sans Arabic',Tahoma,sans-serif;background:var(--sand);color:var(--ink);line-height:1.8;font-size:16px}
h1,h2,h3,.hd{font-family:'Readex Pro','IBM Plex Sans Arabic',Tahoma,sans-serif}
a{color:inherit;text-decoration:none}button{font:inherit;cursor:pointer}
.top{position:sticky;top:0;z-index:20;background:var(--teal);color:#fff;display:flex;align-items:center;gap:12px;padding:10px 16px;height:60px}
.top b{font-family:'Readex Pro',sans-serif;font-weight:500;font-size:1rem;flex:1;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.top .lg{height:38px;max-width:90px;object-fit:contain;border-radius:8px}
.ib{background:rgba(255,255,255,.14);border:0;color:#fff;width:40px;height:40px;border-radius:10px;font-size:1.2rem}
nav{position:fixed;right:0;top:60px;bottom:0;width:300px;max-width:86vw;z-index:19;background:var(--paper);border-left:1px solid var(--line);padding:14px 0 90px;overflow:auto;transform:translateX(100%);transition:transform .25s;box-shadow:-8px 0 30px #0003}
body.open nav{transform:none}
#ov{position:fixed;inset:60px 0 0 0;background:#0005;z-index:18;display:none}body.open #ov{display:block}
nav a{display:flex;align-items:center;gap:10px;padding:8px 18px;font-size:.95rem;border-right:5px solid transparent}
nav a i{width:10px;height:22px;border-radius:5px;background:var(--c);flex:none}
nav a:hover,nav a.on{background:var(--sand);border-right-color:var(--c);font-weight:600}
nav .sub a{padding-right:38px;font-size:.88rem}
main{max-width:1000px;margin:0 auto;padding:28px clamp(14px,4vw,48px) 120px}
.ic{width:30px;height:30px;border-radius:calc(var(--r)*.6);background:color-mix(in srgb,var(--c) 18%,white);color:var(--c);display:grid;place-items:center;flex:none;font-size:1.05rem;overflow:hidden}.ic img{width:100%;height:100%;object-fit:cover}
.hero{background:var(--teal);color:#fff;border-radius:calc(var(--r)*1.5);padding:34px 26px;display:grid;grid-template-columns:auto 1fr;gap:26px;align-items:center;position:relative;overflow:hidden}
.hero:before{content:"";position:absolute;left:-60px;top:-60px;width:220px;height:220px;border-radius:50%;border:30px solid #ffffff12}
.ph{width:140px;height:170px;background:#ffffff1f center/cover;border:4px solid var(--brass);display:grid;place-items:center;font-size:3rem;border-radius:70px 70px 18px 18px}
[data-shape=circle] .ph{border-radius:50%;height:140px}[data-shape=round] .ph{border-radius:28px}[data-shape=square] .ph{border-radius:0}
.hero small{color:var(--brass);filter:brightness(1.6);font-size:.95rem}
.hero h1{font-size:clamp(1.6rem,5vw,2.4rem);line-height:1.4;margin:4px 0}.hero p{opacity:.88}
.meta{display:flex;flex-wrap:wrap;gap:8px;margin-top:14px}.meta span{background:#ffffff1a;border-radius:99px;padding:3px 14px;font-size:.88rem}
@media(max-width:560px){.hero{grid-template-columns:1fr;text-align:center;justify-items:center}.meta{justify-content:center}}
.sec-t{font-size:1.15rem;margin:30px 0 12px;color:var(--teal)}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(210px,1fr));gap:12px;margin-top:14px}
.card{background:var(--paper);border-radius:6px var(--r) var(--r) 6px;padding:14px 16px 14px 12px;border-right:8px solid var(--c);display:flex;align-items:center;gap:10px;min-height:68px;box-shadow:0 1px 0 var(--line);transition:transform .15s}
.card:hover{transform:translateX(-3px)}.card b{font-weight:600;font-size:.97rem;line-height:1.5}.card em{font-style:normal;color:var(--mut);font-size:.8rem;margin-right:auto}
[data-cs=box] .card{border:2px solid var(--c);border-radius:var(--r)}
[data-cs=solid] .card{background:var(--c);color:#fff;border:0;border-radius:var(--r)}[data-cs=solid] .card .ic{background:#ffffff30;color:#fff}[data-cs=solid] .card em{color:#ffffffcc}
.crumb{font-size:.85rem;color:var(--mut)}.crumb a:hover{color:var(--teal)}
.pt{font-size:clamp(1.5rem,4vw,2rem);margin:6px 0 18px;padding-right:16px;border-right:8px solid var(--c);display:flex;align-items:center;gap:12px}
.pt .ic{width:44px;height:44px;font-size:1.5rem}
.ed{background:var(--paper);border-radius:var(--r);padding:20px 22px;min-height:80px;border:1px solid var(--line);margin-top:16px}
.ed h3{color:var(--teal);margin:14px 0 4px;font-size:1.15rem}.ed ul,.ed ol{padding-right:24px}.ed img{max-width:100%}
/* book */
.bkbar{display:flex;align-items:center;justify-content:space-between;gap:8px;margin-top:16px;font-size:.9rem;color:var(--mut)}
.bkbar button{background:var(--teal);color:#fff;border:0;border-radius:10px;padding:7px 16px}.bkbar button:disabled{opacity:.25}
.sp{display:flex;margin-top:10px;position:relative;perspective:1600px}
.pg{flex:1;min-width:0;background:var(--paper);border:1px solid var(--line);border-radius:var(--r);padding:6px 18px 20px;box-shadow:0 14px 30px -18px #0008;position:relative;backface-visibility:hidden}
.pg .ed{border:0;background:none;padding:14px 4px;margin-top:0}
.sp.one.rtl .pg{border-right:12px solid #d9cfb8}.sp.one.ltr .pg{border-left:12px solid #d9cfb8}
.sp.two .pg{border-radius:0;box-shadow:none}
.sp.two.rtl .pg:first-child{border-radius:0 var(--r) var(--r) 0;box-shadow:inset 22px 0 22px -22px #0006}.sp.two.rtl .pg:nth-child(2){border-radius:var(--r) 0 0 var(--r);box-shadow:inset -22px 0 22px -22px #0006;border-right:0}
.sp.two.ltr .pg:first-child{border-radius:var(--r) 0 0 var(--r);box-shadow:inset -22px 0 22px -22px #0006}.sp.two.ltr .pg:nth-child(2){border-radius:0 var(--r) var(--r) 0;box-shadow:inset 22px 0 22px -22px #0006;border-left:0}
.lf{position:absolute;margin:0;transform-origin:var(--o) center;pointer-events:none;box-shadow:0 0 40px #0006}
.lf.n{z-index:5;animation:lfn .65s ease-in forwards}.lf.u{z-index:1;box-shadow:none}
.fl-in{z-index:5;transform-origin:var(--o) center;animation:lfp .65s ease-out;box-shadow:0 0 40px #0006}
@keyframes lfn{from{transform:rotateY(0);opacity:1}70%{opacity:1}to{transform:rotateY(var(--a));opacity:0}}
@keyframes lfp{from{transform:rotateY(var(--a));opacity:0}30%{opacity:1}to{transform:rotateY(0);opacity:1}}
.media{display:grid;grid-template-columns:repeat(auto-fill,minmax(220px,1fr));gap:12px;margin-top:10px}.media.one{grid-template-columns:1fr}
.media figure{position:relative;margin:0;border-radius:var(--r);overflow:hidden}
.media figure.sk{min-height:260px;background:linear-gradient(100deg,#ece5d4 30%,#f7f2e6 50%,#ece5d4 70%);background-size:200% 100%;animation:shm 1.2s linear infinite}
@keyframes shm{to{background-position:-200% 0}}
.media img{width:100%;display:block;border-radius:var(--r);background:#fff;opacity:0;transition:opacity .3s}.media img.ld{opacity:1}
.file{grid-column:1/-1;position:relative;display:flex;gap:8px;align-items:center;background:var(--sand);border-radius:10px;padding:10px 14px}.file a{flex:1;color:var(--teal);font-weight:600}
.pdfv{grid-column:1/-1;width:100%;height:70vh;border:1px solid var(--line);border-radius:10px}@media(max-width:700px){.pdfv{display:none}}
.gv{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:12px;margin-top:16px}
.gc{position:relative;background:var(--paper);border:1px solid var(--line);border-radius:var(--r);padding:0;overflow:hidden;aspect-ratio:3/4;text-align:right}
.gc img{width:100%;height:100%;object-fit:cover;display:block}.gc .tx{padding:12px;font-size:.85rem;color:var(--mut)}
.gc span{position:absolute;bottom:6px;left:6px;background:var(--teal);color:#fff;border-radius:99px;padding:0 10px;font-size:.8rem}
/* schedule */
.sch{margin-top:16px;--sr:14px}
.tw{overflow-x:auto;padding-bottom:6px}
.sch table{border-collapse:separate;border-spacing:6px;width:100%;min-width:780px;text-align:center}
.sch th{background:var(--hc,var(--teal));color:#fff;padding:8px 4px;border-radius:var(--sr);font-family:'Readex Pro',sans-serif;font-weight:500;font-size:.92rem;line-height:1.5}
.sch th small{display:block;font-size:.72rem;opacity:.8;font-family:'IBM Plex Sans Arabic',sans-serif}
.sch th.dy{background:color-mix(in srgb,var(--hc,var(--teal)) 12%,white);color:var(--ink);font-size:1rem}
.sch td{padding:0;vertical-align:top;height:78px}
.chip{height:100%;min-height:78px;border-radius:var(--sr);padding:6px;display:flex;flex-direction:column;justify-content:center;gap:2px;background:color-mix(in srgb,var(--k) 13%,white);border:1px solid color-mix(in srgb,var(--k) 32%,white);color:var(--k)}
.chip b{font-family:'Readex Pro',sans-serif;font-size:.95rem}.chip span{font-size:.72rem;color:color-mix(in srgb,var(--k) 55%,#555);line-height:1.4}
.chip.e{background:none;border:1.5px dashed #d8d2c4;color:#bbb;align-items:center}
body.admin .sch td[data-act],body.admin .sch th[data-act]{cursor:pointer}
.cvh{display:flex;gap:20px;align-items:center;background:var(--paper);border:1px solid var(--line);border-radius:var(--r);padding:18px;margin-top:10px}
.cvh .ph{width:96px;height:116px;font-size:2rem;flex:none}
/* admin */
.adm{background:#fff4d6;border:1px dashed var(--brass);border-radius:12px;padding:10px;display:flex;flex-wrap:wrap;gap:6px;margin-top:12px;align-items:center;font-size:.88rem}
.adm button,.tb button,.mini{background:#fff;border:1px solid var(--line);border-radius:8px;padding:5px 11px;font-size:.88rem}
.adm button.on{background:var(--teal);color:#fff}.adm .r,.mini.r{color:#b3261e}
.mini{position:absolute;top:6px;left:6px;padding:1px 9px;z-index:3}
.adm input[type=color]{width:38px;height:32px;border:0;padding:0;background:none}
.tb{display:flex;gap:4px;margin-top:10px;flex-wrap:wrap}
[contenteditable]{outline:2px dashed #b8862f88;outline-offset:2px}
#bar{position:fixed;bottom:0;right:0;left:0;z-index:30;background:#1c1c1c;color:#fff;padding:8px 14px;display:none;gap:6px;align-items:center;flex-wrap:wrap}
body.admin #bar{display:flex}
#bar button{background:#ffffff1f;border:0;color:#fff;border-radius:8px;padding:6px 11px;font-size:.88rem}#bar button.go{background:var(--brass)}
#st{flex:1;font-size:.85rem;opacity:.8;min-width:100px}
#pvb{display:none;position:fixed;bottom:14px;right:14px;z-index:40;background:var(--brass);color:#fff;border:0;border-radius:99px;padding:10px 18px;box-shadow:0 6px 18px #0005}body.pv #pvb{display:block}
#toast{display:none;position:fixed;bottom:70px;left:50%;transform:translateX(-50%);background:#222;color:#fff;padding:10px 18px;border-radius:10px;z-index:60;max-width:90vw;text-align:center}
dialog{border:0;border-radius:16px;padding:20px;width:min(440px,92vw);font-family:inherit;max-height:90vh;overflow:auto}
dialog::backdrop{background:#0008}dialog label{display:block;font-size:.85rem;margin-top:10px;color:var(--mut)}
dialog input,dialog select{width:100%;padding:8px 10px;border:1px solid var(--line);border-radius:8px;font:inherit;background:#fff}dialog input[type=color]{height:40px;padding:2px}
dialog .row{display:flex;gap:8px;margin-top:16px}dialog button{padding:8px 18px;border-radius:8px;border:1px solid var(--line);background:#fff;font:inherit}dialog button.go{background:var(--teal);color:#fff;border-color:var(--teal)}
@media print{.top,nav,#bar,.adm,.tb,.bkbar{display:none!important}main{padding:0}}
</style>
</head>
<body>
<header class="top"><button class="ib" id="menu" data-act="menu" aria-label="القائمة">☰</button><img id="lg" class="lg" alt="" hidden><b id="ttl">ملف الإنجاز المهني</b><a class="ib" href="#/home" style="display:grid;place-items:center" aria-label="الرئيسية">⌂</a></header>
<nav id="nav"></nav><main id="main"></main>
<div id="ov" data-act="menu"></div>
<button id="pvb" data-act="unpv">⬅ العودة للتعديل</button><input type="file" id="pi" hidden accept="application/pdf"><input type="file" id="fi" hidden accept="image/*,application/pdf" multiple>
<div id="bar"><span id="st">وضع التعديل</span>
<button data-act="addsec" data-p="">+ قسم</button><button data-act="settings">الواجهة</button><button data-act="theme">🎨 التصميم</button><button data-act="uplogo">شعار</button><button data-act="upphoto">صورتي</button><button data-act="chpw">كلمة المرور</button><button class="go" data-act="save">حفظ</button><button data-act="logout">خروج</button></div>
<div id="toast"></div><dialog id="dlg"><form method="dialog" id="df"></form></dialog>
<script>
const $=s=>document.querySelector(s),esc=s=>String(s??'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const uid=()=>Math.random().toString(36).slice(2,9);
const COL=['#e8b72f','#e5702a','#a82255','#2f8f4e','#9b2a98','#3d9bd6','#d63a34','#4db35f','#7a7a7a','#1e4f8f','#8dc63f','#c3a27c','#5bc4b8','#2a6cb5'];
const NAMES=['الهدف من الملف','أهداف سياسة التعليم في المملكة','السيرة الذاتية','مدونة السلوك الوظيفي','الرؤية والرسالة','الدورات','الجداول','شهادات التطوع','المبادرات','الاستراتيجيات المستخدمة','أوراق العمل','الأنشطة المنفذة داخل المدرسة','الاختبارات','تحليل وتصنيف نتائج الطالبات','الفهم القرائي','سجل المتابعة','سجل رصد الدرجات','الخطة الإثرائية','الخطة العلاجية','تحفيز الطالبات (شهادات)','وسائل التواصل مع أولياء الأمور','تصنيف الطالبات حسب المستوى','خطة التعلم الأسبوعية','استخدام برنامج تقني'];
const CVHTML='<h3>البيانات الشخصية</h3><ul><li>الاسم: …</li><li>الجنسية: …</li><li>التخصص: …</li><li>التواصل: …</li></ul><h3>المؤهلات العلمية</h3><ul><li>…</li></ul><h3>الخبرات العملية</h3><ul><li>…</li></ul><h3>المهارات</h3><ul><li>…</li></ul>';
const TH0={p:'#0f4c47',a:'#b8862f',bg:'#f6f0e4',card:'#fffdf8',ink:'#10332f',r:14,shape:'arch',cs:'stripe',dir:'rtl',order:'rf',logo:''};
function newSched(){const K={'ثاني 1':'#2e7d4f','رابع 2':'#2a8a8a','رابع 1':'#7b3fa0','ثاني 2':'#2a6cb5','خامس 2':'#d9772b'},
 Q='القرآن الكريم والدراسات الإسلامية',F='التربية الفنية',L='المهارات الحياتية والأسرية',R='المهارات الرقمية',B='التربية البدنية والدفاع عن النفس',
 rows=[[['ثاني 1',Q],['رابع 2',L],0,0,['رابع 1',L],['ثاني 1',F],0],[0,['ثاني 1',F],0,0,0,['رابع 1',R],['ثاني 1',Q]],[0,['رابع 1',R],['ثاني 1',Q],0,['ثاني 2',B],0,0],[['ثاني 1',Q],0,0,['ثاني 2',B],0,['خامس 2',B],0],[0,['ثاني 2',B],['خامس 2',B],0,['ثاني 1',Q],0,0]],cells={};
 rows.forEach((r,d)=>r.forEach((c,p)=>{if(c)cells[d+','+p]={c:c[0],s:c[1],col:K[c[0]]}}));
 const T=['7:00 - 7:35','7:37 - 8:12','8:14 - 8:49','8:51 - 9:26','9:28 - 10:03','10:05 - 10:40','10:42 - 11:17'],N=['الأولى','الثانية','الثالثة','الرابعة','الخامسة','السادسة','السابعة'];
 return{days:['الأحد','الاثنين','الثلاثاء','الأربعاء','الخميس'],periods:N.map((n,i)=>({n,t:T[i]})),cells,r:14,hc:''}}
function defaults(){return{settings:{name:'الأستاذة / اسم المعلمة',role:'معلمة المرحلة الابتدائية',school:'اسم المدرسة',year:'العام الدراسي ١٤٤٧هـ',tagline:'ملف الإنجاز المهني',photo:''},theme:{...TH0},
 sections:NAMES.map((t,i)=>({id:uid(),title:t,color:COL[i%COL.length],type:i==2?'cv':i==6?'schedule':'page',icon:'',bg:'',view:'book',spread:1,pages:[{html:i==2?CVHTML:'<p>اكتبي محتوى القسم هنا…</p>',media:[]}],photo:'',schedule:i==6?newSched():null,children:[]}))}}
let pg=0,last='',fd='',fb=false,pv=false,D=defaults(),admin=false,pw=sessionStorage.pw||'',cur='home',T,iconMode=null;
const st=t=>$('#st').textContent=t;
const touch=()=>{clearTimeout(T);T=setTimeout(save,1500);st('تعديلات غير محفوظة…')};
function find(id,list=D.sections,path=[]){for(let i=0;i<list.length;i++){const s=list[i];if(s.id==id)return{s,list,i,path};const f=find(id,s.children,[...path,s]);if(f)return f}return null}
const plain=h=>(h||'').replace(/<[^>]*>/g,'').trim();
const blank=q=>q.media.length==0&&(plain(q.html)==''||plain(q.html).startsWith('اكتبي'));
function slot(s){const q=s.pages[pg];if(blank(q)){q.html='';return q}const n={html:'',media:[]};s.pages.splice(pg+1,0,n);pg++;return n}
function img(u){const m=(u||'').match(/drive\.google\.com.*?(?:\/d\/|[?&]id=)([\w-]+)/);return m?'https://drive.google.com/thumbnail?id='+m[1]+'&sz=w1600':u}
const isImg=u=>/^(https?:|\/api\/file|data:)/.test(u||'');
function ico(s){return s.icon?`<span class="ic" style="--c:${s.color}">${isImg(s.icon)?`<img src="${esc(img(s.icon))}" alt="">`:esc(s.icon)}</span>`:''}
function norm(l){l.forEach(s=>{if(!s.pages)s.pages=[{html:s.html||'',media:[...(s.images||[]).map(u=>({k:'img',u})),...(s.links||[]).map(x=>({k:'link',u:x.u,t:x.t}))]}];
 if(s.type=='schedule'&&(!s.schedule||!s.schedule.cells))s.schedule=newSched();s.view=s.view||'book';s.spread=s.spread||1;s.icon=s.icon||'';s.bg=s.bg||'';norm(s.children||[])})}
async function load(){try{const r=await fetch('/api/data',{cache:'no-store'});const d=await r.json();if(d&&d.sections)D=d}catch(e){}
 D.theme={...TH0,...(D.theme||{})};norm(D.sections);if(pw){admin=await verify(pw)}route()}
async function verify(p){try{const r=await fetch('/api/data',{method:'POST',headers:{'x-admin-password':p,'content-type':'application/json'},body:'{"verify":true}'});return r.ok}catch(e){return false}}
async function save(){if(!admin)return;st('جاري الحفظ…');try{const r=await fetch('/api/data',{method:'POST',headers:{'x-admin-password':pw,'content-type':'application/json'},body:JSON.stringify(D)});st(r.ok?'تم الحفظ ✓':'فشل الحفظ — سجلي الدخول من جديد')}catch(e){st('فشل الحفظ — لا يوجد اتصال')}}
function applyTheme(){const t=D.theme,r=document.documentElement.style,f=cur!='home'&&find(cur);r.setProperty('--teal',t.p);r.setProperty('--brass',t.a);r.setProperty('--sand',(f&&f.s.bg)||t.bg);r.setProperty('--paper',t.card);r.setProperty('--ink',t.ink);r.setProperty('--r',(+t.r||0)+'px');document.body.dataset.shape=t.shape;document.body.dataset.cs=t.cs;
 const l=$('#lg');l.hidden=!t.logo;if(t.logo)l.src=img(t.logo)}
function route(){cur=(location.hash.match(/#\/(.+)/)||[])[1]||'home';document.body.classList.toggle('admin',admin);document.body.classList.toggle('pv',pv);document.body.classList.remove('open');if(cur!=last){pg=0;fb=false;last=cur;scrollTo(0,0)}
 $('#ttl').textContent=D.settings.tagline||'ملف الإنجاز';document.title=D.settings.name+' | '+D.settings.tagline;applyTheme();
 $('#nav').innerHTML=navH(D.sections);main()}
function navH(l){return l.map(s=>`<a href="#/${s.id}" class="${s.id==cur?'on':''}" style="--c:${s.color}">${ico(s)||'<i></i>'}${esc(s.title)}</a>`+(s.children.length&&inTree(s,cur)?`<div class="sub">${navH(s.children)}</div>`:'')).join('')}

  const p=b.dataset.p?find(b.dataset.p).s.children:D.sections;p.push(n);touch();location.hash='#/'+n.id;return route()}
 if(!s)return;
 if(a=='ren'){const t=prompt('الاسم الجديد:',s.title);if(t){s.title=t;touch();route()}}
 else if(a=='icon')ask('أيقونة القسم',[['i','إيموجي أو رابط صورة (اتركيه فارغًا للحذف)',s.icon]],v=>{s.icon=v.i.trim();touch();route()});
 else if(a=='rbg'){s.bg='';touch();route()}
 else if(a=='view'){s.view=b.dataset.v;touch();route()}
 else if(a=='spread'){s.spread=+b.dataset.v;touch();route()}
 else if(a=='del'){if(confirm('حذف "'+s.title+'" وكل ما بداخله؟')){f.list.splice(f.i,1);touch();location.hash='#/home';route()}}
 else if(a=='up'&&f.i>0){[f.list[f.i-1],f.list[f.i]]=[f.list[f.i],f.list[f.i-1]];touch();route()}
 else if(a=='down'&&f.i<f.list.length-1){[f.list[f.i+1],f.list[f.i]]=[f.list[f.i],f.list[f.i+1]];touch();route()}
 else if(a=='into'&&f.i>0){f.list.splice(f.i,1);f.list[f.i-1].children.push(s);touch();route()}
 else if(a=='out'&&f.path.length){const par=f.path[f.path.length-1],g=find(par.id);f.list.splice(f.i,1);g.list.splice(g.i+1,0,s);touch();route()}
 else if(a=='addimg'){const u=prompt('رابط الصورة (يقبل رابط مشاركة جوجل درايف):');if(u){s.pages[pg].media.push({k:'img',u:u.trim()});touch();route()}}
 else if(a=='addlink'){const u=prompt('الرابط:');if(!u)return;const t=prompt('عنوان الرابط:','فتح الملف');s.pages[pg].media.push({k:/\.pdf($|\?)/i.test(u)?'pdf':'link',u:u.trim(),t:t||'فتح الملف'});touch();route()}
 else if(a=='delm'){s.pages[pg].media.splice(i,1);touch();route()}
 else if(a=='addpg'){s.pages.splice(pg+1,0,{html:'<p>اكتبي المحتوى هنا…</p>',media:[]});pg++;touch();route()}
 else if(a=='delpg'){if(s.pages.length>1&&confirm('حذف هذه الصفحة؟')){s.pages.splice(pg,1);pg=Math.max(0,pg-1);touch();route()}else if(s.pages.length<2)alert('لا يمكن حذف الصفحة الوحيدة')}
 else if(a=='cell'&&admin){const k=b.dataset.k,[d,p]=k.split(','),c=sc.cells[k]||{c:'',s:'',col:COL[Math.floor(Math.random()*COL.length)]};
  ask(sc.days[d]+' — '+sc.periods[p].n+' (اتركي الصف والمادة فارغين للمسح)',[['c','الصف / الفصل',c.c],['s','المادة',c.s],['col','اللون',c.col,'color']],v=>{if(!v.c.trim()&&!v.s.trim())delete sc.cells[k];else sc.cells[k]={c:v.c,s:v.s,col:v.col};touch();route()})}
 else if(a=='ph'&&admin){const p=sc.periods[i];ask('تعديل الحصة',[['n','الاسم',p.n],['t','الوقت',p.t]],v=>{sc.periods[i]={n:v.n,t:v.t};touch();route()})}
 else if(a=='dy'&&admin){ask('اسم اليوم',[['n','الاسم',sc.days[i]]],v=>{sc.days[i]=v.n;touch();route()})}
 else if(a=='padd'){sc.periods.push({n:'الحصة '+(sc.periods.length+1),t:''});touch();route()}
 else if(a=='pdel'&&sc.periods.length>1){const n=sc.periods.length-1;sc.periods.pop();Object.keys(sc.cells).forEach(k=>{if(+k.split(',')[1]>=n)delete sc.cells[k]});touch();route()}
 else if(a=='dadd'){sc.days.push('يوم جديد');touch();route()}
 else if(a=='ddel'&&sc.days.length>1){const n=sc.days.length-1;sc.days.pop();Object.keys(sc.cells).forEach(k=>{if(+k.split(',')[0]>=n)delete sc.cells[k]});touch();route()}
 else if(a=='srad'){sc.r=+b.dataset.v;touch();route()}
});
document.addEventListener('click',e=>{if(e.target.closest('nav a'))document.body.classList.remove('open')});
addEventListener('hashchange',route);
$('#fi').addEventListener('change',async e=>{const fs=[...e.target.files];e.target.value='';const mode=iconMode;iconMode=null;if(!fs.length)return;
 if(mode){const m=await up(fs[0]);if(!m)return;if(mode=='uplogo')D.theme.logo=m.u;else if(mode=='upphoto')D.settings.photo=m.u;else{const f=find(cur);if(f)f.s.icon=m.u}touch();return route()}
 const f=find(cur);if(!f)return;const s=f.s,ni=fs.filter(x=>x.type.startsWith('image/')).length;
 const sep=ni>1&&confirm('اخترتِ '+ni+' صور.\nموافق = كل صورة في صفحة مستقلة (للشبكة والكتاب)\nإلغاء = كلها في هذه الصفحة');let first=null;
 for(const file of fs){const m=await up(file);if(!m)continue;if(sep&&m.k=='img'){const q=slot(s);if(first==null)first=pg;q.media.push(m)}else s.pages[pg].media.push(m)}
 if(first!=null)pg=first;touch();route()});
$('#pi').addEventListener('change',async e=>{const x=e.target.files[0];e.target.value='';if(x)await importPdf(x)});
let tx=0;addEventListener('touchstart',e=>tx=e.changedTouches[0].clientX,{passive:true});
addEventListener('touchend',e=>{if(admin||cur=='home')return;const d=e.changedTouches[0].clientX-tx;if(Math.abs(d)>70){const rtl=D.theme.dir!='ltr';go((d<0)==rtl?1:-1)}});
addEventListener('keydown',e=>{if(admin||cur=='home'||e.target.closest('dialog'))return;const rtl=D.theme.dir!='ltr';if(e.key=='ArrowLeft')go(rtl?1:-1);if(e.key=='ArrowRight')go(rtl?-1:1)});
let wide=innerWidth>=760;addEventListener('resize',()=>{if((innerWidth>=760)!=wide){wide=!wide;route()}});
load();
