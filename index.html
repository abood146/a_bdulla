<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>ملف الإنجاز المهني</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+Arabic:wght@400;500;600&family=Readex+Pro:wght@500;700&display=swap" rel="stylesheet">
<style>
:root{--ink:#10332f;--teal:#0f4c47;--sand:#f6f0e4;--paper:#fffdf8;--brass:#b8862f;--rose:#b4476b;--mut:#6b7a77;--line:#e4dccb}
*{box-sizing:border-box;margin:0}
html{scroll-behavior:smooth}
body{font-family:'IBM Plex Sans Arabic',Tahoma,sans-serif;background:var(--sand);color:var(--ink);line-height:1.8;font-size:16px}
h1,h2,h3,.hd{font-family:'Readex Pro','IBM Plex Sans Arabic',Tahoma,sans-serif}
a{color:inherit;text-decoration:none}
button{font:inherit;cursor:pointer}
.top{position:sticky;top:0;z-index:20;background:var(--teal);color:#fff;display:flex;align-items:center;gap:12px;padding:10px 16px}
.top b{font-family:'Readex Pro',sans-serif;font-weight:500;font-size:1rem;flex:1;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.ib{background:rgba(255,255,255,.12);border:0;color:#fff;width:40px;height:40px;border-radius:10px;font-size:1.2rem}
.wrap{display:flex;min-height:calc(100vh - 60px)}
nav{position:fixed;right:0;top:60px;bottom:0;width:300px;max-width:86vw;z-index:19;background:var(--paper);border-left:1px solid var(--line);padding:14px 0 90px;overflow:auto;transform:translateX(100%);transition:transform .25s;box-shadow:-8px 0 30px #0003}
body.open nav{transform:none}
#ov{position:fixed;inset:60px 0 0 0;background:#0005;z-index:18;display:none}body.open #ov{display:block}
nav a{display:flex;align-items:center;gap:10px;padding:8px 18px;font-size:.95rem;border-right:5px solid transparent}
nav a i{width:10px;height:22px;border-radius:5px;background:var(--c);flex:none}
nav a:hover,nav a.on{background:var(--sand);border-right-color:var(--c);font-weight:600}
nav .sub a{padding-right:38px;font-size:.88rem;color:#3d514d}
main{flex:1;min-width:0;margin:0 auto;padding:28px clamp(16px,4vw,48px) 120px;max-width:1000px}

/* hero */
.hero{background:var(--teal);color:#fff;border-radius:22px;padding:34px 26px;display:grid;grid-template-columns:auto 1fr;gap:26px;align-items:center;position:relative;overflow:hidden}
.hero:before{content:"";position:absolute;left:-60px;top:-60px;width:220px;height:220px;border-radius:50%;border:30px solid #ffffff12}
.ph{width:140px;height:170px;border-radius:70px 70px 18px 18px;background:#ffffff1f center/cover;border:4px solid var(--brass);display:grid;place-items:center;font-size:3rem}
.hero small{color:#e8d3a0;font-size:.95rem}
.hero h1{font-size:clamp(1.6rem,5vw,2.4rem);line-height:1.4;margin:4px 0}
.hero p{opacity:.88}
.meta{display:flex;flex-wrap:wrap;gap:8px;margin-top:14px}
.meta span{background:#ffffff1a;border-radius:99px;padding:3px 14px;font-size:.88rem}
@media(max-width:560px){.hero{grid-template-columns:1fr;text-align:center;justify-items:center}.meta{justify-content:center}}
.sec-t{font-size:1.15rem;margin:30px 0 12px;color:var(--teal)}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(210px,1fr));gap:12px;margin-top:14px}
.card{background:var(--paper);border-radius:6px 14px 14px 6px;padding:14px 16px 14px 12px;border-right:8px solid var(--c);display:flex;align-items:center;gap:10px;min-height:68px;box-shadow:0 1px 0 var(--line);transition:transform .15s}
.card:hover{transform:translateX(-3px)}
.card b{font-weight:600;font-size:.97rem;line-height:1.5}
.card em{font-style:normal;color:var(--mut);font-size:.8rem;margin-right:auto}
/* page */
.crumb{font-size:.85rem;color:var(--mut)}.crumb a:hover{color:var(--teal)}
.pt{font-size:clamp(1.5rem,4vw,2rem);margin:6px 0 18px;padding-right:16px;border-right:8px solid var(--c)}
.ed{background:var(--paper);border-radius:14px;padding:20px 22px;min-height:120px;border:1px solid var(--line);margin-top:16px}
.ed h3{color:var(--teal);margin:14px 0 4px;font-size:1.15rem}.ed ul,.ed ol{padding-right:24px}.ed img{max-width:100%}
.imgs{display:grid;grid-template-columns:repeat(auto-fill,minmax(220px,1fr));gap:12px;margin-top:16px}
.imgs div{position:relative}.imgs img{width:100%;border-radius:12px;border:1px solid var(--line);background:#fff;display:block}
.links{margin-top:16px;display:flex;flex-direction:column;gap:8px}
.links div{display:flex;gap:6px}
.links a{flex:1;background:var(--paper);border:1px solid var(--line);border-radius:10px;padding:10px 14px;color:var(--teal);font-weight:500}
.links a:before{content:"↗ ";color:var(--brass)}
.tw{overflow-x:auto;margin-top:16px;border-radius:14px;border:1px solid var(--line);background:var(--paper)}
table{border-collapse:collapse;width:100%;min-width:560px;text-align:center}
th{background:var(--teal);color:#fff;padding:10px;font-family:'Readex Pro',sans-serif;font-weight:500}
td{border:1px solid var(--line);padding:10px 6px}
td:first-child{background:var(--sand);font-weight:600}
tr:has(td[data-brk]) td{background:#f3e7c8;color:var(--brass)}
.cvh{display:flex;gap:20px;align-items:center;background:var(--paper);border:1px solid var(--line);border-radius:14px;padding:18px;margin-top:10px}
.cvh .ph{width:96px;height:116px;border-radius:48px 48px 14px 14px;font-size:2rem;flex:none}
/* admin */
.adm{background:#fff4d6;border:1px dashed var(--brass);border-radius:12px;padding:10px;display:flex;flex-wrap:wrap;gap:6px;margin-top:14px;align-items:center}
.adm button,.tb button,.mini{background:#fff;border:1px solid var(--line);border-radius:8px;padding:5px 11px;font-size:.88rem}
.adm .r,.mini.r{color:#b3261e}
.mini{position:absolute;top:6px;left:6px;padding:1px 9px}
.links .mini{position:static}
.adm input[type=color]{width:38px;height:32px;border:0;padding:0;background:none}
.tb{display:flex;gap:4px;margin-top:14px;flex-wrap:wrap}
[contenteditable]{outline:2px dashed #b8862f88;outline-offset:2px}
td[contenteditable],th[contenteditable]{outline-offset:-2px}
#bar{position:fixed;bottom:0;right:0;left:0;z-index:30;background:#1c1c1c;color:#fff;padding:8px 14px;display:none;gap:8px;align-items:center;flex-wrap:wrap}
body.admin #bar{display:flex}
#bar button{background:#ffffff1f;border:0;color:#fff;border-radius:8px;padding:6px 12px}
#bar button.go{background:var(--brass)}
#st{flex:1;font-size:.85rem;opacity:.8;min-width:120px}
.bkbar{display:flex;align-items:center;justify-content:space-between;gap:8px;margin-top:16px;font-size:.9rem;color:var(--mut)}
.bkbar button{background:var(--teal);color:#fff;border:0;border-radius:10px;padding:7px 16px}.bkbar button:disabled{opacity:.25}
.book{background:var(--paper);border:1px solid var(--line);border-right:12px solid #d9cfb8;border-radius:6px 16px 16px 6px;padding:6px 18px 20px;margin-top:10px;box-shadow:0 14px 30px -18px #0008;transform-origin:right center}
.book .ed{border:0;background:none;padding:14px 4px;margin-top:0}
.book.n{animation:fn .45s ease-out}.book.p{transform-origin:left center;animation:fp .45s ease-out}
@keyframes fn{from{transform:perspective(1500px) rotateY(70deg);opacity:.2}to{transform:none;opacity:1}}
@keyframes fp{from{transform:perspective(1500px) rotateY(-70deg);opacity:.2}to{transform:none;opacity:1}}
@media(prefers-reduced-motion:reduce){.book.n,.book.p{animation:none}}
.media{display:grid;grid-template-columns:repeat(auto-fill,minmax(220px,1fr));gap:12px;margin-top:10px}
.media figure{position:relative;margin:0}.media img{width:100%;border-radius:12px;border:1px solid var(--line);display:block;background:#fff}
.file{grid-column:1/-1;position:relative;display:flex;gap:8px;align-items:center;background:var(--sand);border-radius:10px;padding:10px 14px}.file a{flex:1;color:var(--teal);font-weight:600}
.pdfv{grid-column:1/-1;width:100%;height:70vh;border:1px solid var(--line);border-radius:10px}@media(max-width:700px){.pdfv{display:none}}
.ph[data-act]{cursor:default}
.media.one{grid-template-columns:1fr}
.gv{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:12px;margin-top:16px}
.gc{position:relative;background:var(--paper);border:1px solid var(--line);border-radius:10px;padding:0;overflow:hidden;aspect-ratio:3/4;text-align:right}
.gc img{width:100%;height:100%;object-fit:cover;display:block}.gc .tx{padding:12px;font-size:.85rem;color:var(--mut)}
.gc span{position:absolute;bottom:6px;left:6px;background:var(--teal);color:#fff;border-radius:99px;padding:0 10px;font-size:.8rem}
#pvb{display:none;position:fixed;bottom:14px;right:14px;z-index:40;background:var(--brass);color:#fff;border:0;border-radius:99px;padding:10px 18px;box-shadow:0 6px 18px #0005}body.pv #pvb{display:block}
dialog{border:0;border-radius:16px;padding:20px;width:min(440px,92vw);font-family:inherit}
#toast{display:none;position:fixed;bottom:70px;left:50%;transform:translateX(-50%);background:#222;color:#fff;padding:10px 18px;border-radius:10px;z-index:60;max-width:90vw;text-align:center}
dialog::backdrop{background:#0008}
dialog label{display:block;font-size:.85rem;margin-top:10px;color:var(--mut)}
dialog input{width:100%;padding:8px 10px;border:1px solid var(--line);border-radius:8px;font:inherit}
dialog .row{display:flex;gap:8px;margin-top:16px}
dialog button{padding:8px 18px;border-radius:8px;border:1px solid var(--line);background:#fff;font:inherit}
dialog button.go{background:var(--teal);color:#fff;border-color:var(--teal)}
@media print{.top,nav,#bar,#lock,.adm,.tb{display:none!important}main{padding:0}}
</style>
</head>
<body>
<header class="top"><button class="ib" id="menu" data-act="menu" aria-label="القائمة">☰</button><b id="ttl">ملف الإنجاز المهني</b><a class="ib" href="#/home" style="display:grid;place-items:center" aria-label="الرئيسية">⌂</a></header>
<div class="wrap"><nav id="nav"></nav><main id="main"></main></div>
<div id="ov" data-act="menu"></div><button id="pvb" data-act="unpv">⬅ العودة للتعديل</button><input type="file" id="pi" hidden accept="application/pdf"><input type="file" id="fi" hidden accept="image/*,application/pdf" multiple>
<div id="bar"><span id="st">وضع التعديل</span>
<button data-act="addsec" data-p="">+ قسم</button><button data-act="settings">الواجهة</button><button data-act="chpw">كلمة المرور</button><button class="go" data-act="save">حفظ</button><button data-act="logout">خروج</button></div>
<div id="toast"></div><dialog id="dlg"><form method="dialog" id="df"></form></dialog>

<script>
const $=s=>document.querySelector(s), esc=s=>String(s??'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const uid=()=>Math.random().toString(36).slice(2,9);
const COL=['#e8b72f','#e5702a','#a82255','#2f8f4e','#9b2a98','#3d9bd6','#d63a34','#4db35f','#a9a9a9','#d63a34','#1e4f8f','#8dc63f','#c3a27c','#5bc4b8','#2a6cb5'];
const NAMES=['الهدف من الملف','أهداف سياسة التعليم في المملكة','السيرة الذاتية','مدونة السلوك الوظيفي','الرؤية والرسالة','الدورات','الجداول','شهادات التطوع','المبادرات','الاستراتيجيات المستخدمة','أوراق العمل','الأنشطة المنفذة داخل المدرسة','الاختبارات','تحليل وتصنيف نتائج الطالبات','الفهم القرائي','سجل المتابعة','سجل رصد الدرجات','الخطة الإثرائية','الخطة العلاجية','تحفيز الطالبات (شهادات)','وسائل التواصل مع أولياء الأمور','تصنيف الطالبات حسب المستوى','خطة التعلم الأسبوعية','استخدام برنامج تقني'];
const CVHTML='<h3>البيانات الشخصية</h3><ul><li>الاسم: …</li><li>الجنسية: …</li><li>التخصص: …</li><li>التواصل: …</li></ul><h3>المؤهلات العلمية</h3><ul><li>…</li></ul><h3>الخبرات العملية</h3><ul><li>…</li></ul><h3>المهارات</h3><ul><li>…</li></ul>';
function sched(){const rows=[];for(let r=0;r<7;r++){if(r==3){rows.push(['استراحة',...Array(5).fill('استراحة')]);continue}
 const subj=['لغتي','رياضيات','علوم','دين','إنجليزي','اجتماعيات','حاسب'];rows.push([String(r+1),...[0,1,2,3,4].map(c=>subj[(r*2+c*3)%7])])}
 return{head:['الحصة','الأحد','الإثنين','الثلاثاء','الأربعاء','الخميس'],rows}}
function defaults(){
 return{settings:{name:'الأستاذة / اسم المعلمة',role:'معلمة المرحلة الابتدائية',school:'اسم المدرسة',year:'العام الدراسي ١٤٤٧هـ',tagline:'ملف الإنجاز المهني',photo:''},
 sections:NAMES.map((t,i)=>({id:uid(),title:t,color:COL[i%COL.length],type:i==2?'cv':i==6?'schedule':'page',pages:[{html:i==2?CVHTML:'<p>اكتبي محتوى القسم هنا…</p>',media:[]}],photo:'',schedule:i==6?sched():null,children:[]}))}}
let pg=0,last='',fd='',fb=false,pv=false,D=defaults(),admin=false,pw=sessionStorage.pw||'',cur='home',T;
const st=t=>$('#st').textContent=t;
const touch=()=>{clearTimeout(T);T=setTimeout(save,1500);st('تعديلات غير محفوظة…')};
function find(id,list=D.sections,path=[]){for(let i=0;i<list.length;i++){const s=list[i];if(s.id==id)return{s,list,i,path};const f=find(id,s.children,[...path,s]);if(f)return f}return null}
function norm(l){l.forEach(s=>{if(!s.pages)s.pages=[{html:s.html||'',media:[...(s.images||[]).map(u=>({k:'img',u})),...(s.links||[]).map(x=>({k:'link',u:x.u,t:x.t}))]}];norm(s.children||[])})}
function go(d){const f=find(cur);if(!f)return;if((f.s.view||'book')!='book'&&!fb)return;const n=pg+d;if(n<0||n>=f.s.pages.length)return;pg=n;fd=d>0?'n':'p';route();scrollTo(0,0)}
function shrink(f){return new Promise(res=>{const im=new Image();im.onload=()=>{const k=Math.min(1,1600/Math.max(im.width,im.height)),c=document.createElement('canvas');c.width=im.width*k;c.height=im.height*k;c.getContext('2d').drawImage(im,0,0,c.width,c.height);c.toBlob(b=>res(b),'image/jpeg',.82)};im.src=URL.createObjectURL(f)})}
async function up(file){st('جاري رفع '+file.name+'…');let b=file,t=file.type;if(t.startsWith('image/')&&t!='image/gif'){b=await shrink(file);t='image/jpeg'}
 if(b.size>5.5e6){alert('الملف أكبر من ٥ ميجا. صغّريه أو ارفعيه على درايف وأضيفي رابطه.');return null}
 const r=await fetch('/api/upload',{method:'POST',headers:{'x-admin-password':pw,'content-type':t},body:b});if(!r.ok){alert('فشل الرفع');return null}
 const j=await r.json();st('تم الرفع ✓');return{k:t=='application/pdf'?'pdf':'img',u:j.url,t:file.name.replace(/\.[^.]+$/,'')}}
const plain=h=>(h||'').replace(/<[^>]*>/g,'').trim();
const blank=q=>q.media.length==0&&(plain(q.html)==''||plain(q.html).startsWith('اكتبي'));
function slot(s){const q=s.pages[pg];if(blank(q)){q.html='';return q}const n={html:'',media:[]};s.pages.splice(pg+1,0,n);pg++;return n}
function mediaH(q,x){const m=q.media.map((m,i)=>{const d=x?`<button class="mini r" data-act="delm" data-i="${i}">✕</button>`:'';
 if(m.k=='img')return `<figure><a href="${esc(img(m.u))}" target="_blank"><img src="${esc(img(m.u))}" loading="lazy" alt=""></a>${d}</figure>`;
 return `<div class="file">${m.k=='pdf'?'📄':'↗'}<a href="${esc(m.u)}" target="_blank" rel="noopener">${esc(m.t||'فتح الملف')}</a>${d}</div>`+(m.k=='pdf'?`<iframe class="pdfv" src="${esc(m.u)}"></iframe>`:'')}).join('');
 return m?`<div class="media ${q.media.length==1&&q.media[0].k=='img'?'one':''}">${m}</div>`:''}
const edv=(q,e)=>(e||plain(q.html))?`<div class="ed" ${e?'contenteditable="true" data-f="html"':''}>${q.html}</div>`:'';
async function put(b,t){if(b.size>5.5e6){alert('حجم الملف أكبر من ٥ ميجا');return null}
 const r=await fetch('/api/upload',{method:'POST',headers:{'x-admin-password':pw,'content-type':t},body:b});if(!r.ok){alert('فشل الرفع');return null}
 return{k:'img',u:(await r.json()).url}}
let pdfl;async function loadPdf(){if(pdfl)return pdfl;await new Promise((ok,no)=>{const c=document.createElement('script');c.src='https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js';c.onload=ok;c.onerror=no;document.head.appendChild(c)});pdfl=window.pdfjsLib;pdfl.GlobalWorkerOptions.workerSrc='https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.worker.min.js';return pdfl}
async function importPdf(file){const f=find(cur);if(!f)return;const s=f.s;let lib;try{lib=await loadPdf()}catch(e){return alert('تعذر تحميل أداة PDF، تأكدي من الاتصال')}
 st('جاري فتح الملف…');let doc;try{doc=await lib.getDocument({data:await file.arrayBuffer()}).promise}catch(e){return alert('تعذر قراءة الملف')}
 const first=blank(s.pages[pg])?pg:pg+1;let ok=0;
 for(let i=1;i<=doc.numPages;i++){st('تحويل الصفحة '+i+' من '+doc.numPages+'…');const g=await doc.getPage(i),v0=g.getViewport({scale:1}),v=g.getViewport({scale:Math.min(2,1300/v0.width)}),c=document.createElement('canvas');c.width=v.width;c.height=v.height;
  await g.render({canvasContext:c.getContext('2d'),viewport:v}).promise;const b=await new Promise(r=>c.toBlob(r,'image/jpeg',.8)),m=await put(b,'image/jpeg');if(!m){alert('توقف الاستيراد عند الصفحة '+i);break}
  slot(s).media.push(m);ok++}
 pg=first;st('تم استيراد '+ok+' صفحة ✓');touch();route()}
function img(u){const m=u.match(/drive\.google\.com.*?(?:\/d\/|[?&]id=)([\w-]+)/);return m?'https://drive.google.com/thumbnail?id='+m[1]+'&sz=w1600':u}
async function load(){try{const r=await fetch('/api/data',{cache:'no-store'});const d=await r.json();if(d&&d.sections)D=d}catch(e){}norm(D.sections);
 if(pw){admin=await verify(pw)}route()}
async function verify(p){try{const r=await fetch('/api/data',{method:'POST',headers:{'x-admin-password':p,'content-type':'application/json'},body:'{"verify":true}'});return r.ok}catch(e){return false}}
async function save(){if(!admin)return;st('جاري الحفظ…');try{const r=await fetch('/api/data',{method:'POST',headers:{'x-admin-password':pw,'content-type':'application/json'},body:JSON.stringify(D)});st(r.ok?'تم الحفظ ✓':'فشل الحفظ — تأكدي من كلمة المرور')}catch(e){st('فشل الحفظ — لا يوجد اتصال')}}
function route(){cur=(location.hash.match(/#\/(.+)/)||[])[1]||'home';document.body.classList.toggle('admin',admin);document.body.classList.toggle('pv',pv);document.body.classList.remove('open');if(cur!=last){pg=0;fb=false;last=cur;scrollTo(0,0)}
 $('#ttl').textContent=D.settings.tagline||'ملف الإنجاز';document.title=D.settings.name+' | '+D.settings.tagline;
 $('#nav').innerHTML=navH(D.sections);main()}
function navH(l){return l.map(s=>`<a href="#/${s.id}" class="${s.id==cur?'on':''}" style="--c:${s.color}"><i></i>${esc(s.title)}</a>`+(s.children.length&&inTree(s,cur)?`<div class="sub">${navH(s.children)}</div>`:'')).join('')}
function inTree(s,id){return s.id==id||s.children.some(c=>inTree(c,id))}
const card=(s,n)=>`<a class="card" href="#/${s.id}" style="--c:${s.color}"><b>${esc(s.title)}</b>${s.children.length?`<em>${s.children.length} فرعي</em>`:''}</a>`;
function main(){const m=$('#main'),S=D.settings;
 if(cur=='home'){m.innerHTML=`<section class="hero"><div class="ph" data-act="login" style="${S.photo?`background-image:url('${esc(img(S.photo))}')`:''}">${S.photo?'':'👩‍🏫'}</div><div><small>${esc(S.tagline)}</small><h1>${esc(S.name)}</h1><p>${esc(S.role)}</p><div class="meta"><span>${esc(S.school)}</span><span>${esc(S.year)}</span></div></div></section>
 <h2 class="sec-t hd">أقسام الملف</h2><div class="grid">${D.sections.map(card).join('')}</div>`;return}
 const f=find(cur);if(!f){location.hash='#/home';return}const s=f.s;pg=Math.min(pg,s.pages.length-1);
